name: Release

# Push a tag such as v1.1.0 to build the Windows executable and publish a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Build executable
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name FolderSync --icon icon.ico --add-data "icon.ico;." main.py
      - name: Package
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist/FolderSync.exe "release/FolderSync-$tag-windows-x64.exe"
          Compress-Archive -Path dist/FolderSync.exe, README.md, LICENSE, CHANGELOG.md `
            -DestinationPath "release/FolderSync-$tag-windows-x64.zip"
          Get-ChildItem release | ForEach-Object { (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower() + "  " + $_.Name } |
            Set-Content release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: FolderSync-windows
          path: release/*
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          notes="docs/releases/${tag}.md"
          if [ -f "$notes" ]; then args=(--notes-file "$notes"); else args=(--generate-notes); fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber
          else
            gh release create "$tag" release/* --title "Folder Sync ${tag}" "${args[@]}"
          fi
